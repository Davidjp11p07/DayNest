lengthAdjust="spacing" textLength="192.9307" x="31" y="893.2527">Consultar giro y mensaje de &#233;xito</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.3481" x="370.3318" y="487.8921"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="134.3481" x="380.3318" y="510.0859">Revertir y mostrar error</text><path d="M318.4856,950.0076 L318.4856,980.905 L298.4856,984.905 L318.4856,988.905 L318.4856,1019.8025 A0,0 0 0 0 318.4856,1019.8025 L597.4543,1019.8025 A0,0 0 0 0 597.4543,1019.8025 L597.4543,960.0076 L587.4543,950.0076 L318.4856,950.0076 A0,0 0 0 0 318.4856,950.0076" fill="#FFF7DB" style="stroke:#A78B40;stroke-width:0.5;"/><path d="M587.4543,950.0076 L587.4543,960.0076 L597.4543,960.0076 L587.4543,950.0076" fill="#FFF7DB" style="stroke:#A78B40;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="205.937" x="324.4856" y="967.2014">Es una simulaci&#243;n acad&#233;mica local.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="202.3315" x="324.4856" y="982.1501">No hay transferencia bancaria real.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.9688" x="324.4856" y="997.0989">Intentos FALLIDO son soportados por la BD;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="251.4941" x="324.4856" y="1012.0476">no constituyen una pasarela implementada.</text><ellipse cx="287.4856" cy="984.905" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="287.4856" cy="984.905" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="48.3535" y2="1019.8025"/><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="168.8271" x="85