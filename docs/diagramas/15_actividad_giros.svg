hAdjust="spacing" textLength="230.5469" x="229.4521" y="295.3423">Bloquear cada renta en una transaccion</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.4961" x="238.9775" y="377.5715"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="191.4961" x="248.9775" y="399.7654">Conservar operacion; no duplicar</text><ellipse cx="344.7256" cy="451.5459" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="344.7256" cy="451.5459" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="290.1643,328.0972,399.2869,328.0972,411.2869,340.0972,399.2869,352.0972,290.1643,352.0972,278.1643,340.0972,290.1643,328.0972" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="9.3882" x="348.7256" y="364.291">si</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="109.1226" x="290.1643" y="344.8167">Giro ya ejecutado?</text><polygon fill="#F1F1F1" points="207.4131,504.5459,482.0381,504.5459,494.0381,519.4946,482.0381,534.4434,207.4131,534.4434,195.4131,519.4946,207.4131,504.5459" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="274.625" x="207.4131" y="516.7397">Pago completo, sin devoluciones ni pendientes,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="271.7114" x="207.4131" y="531.6885">tasa historica y cuenta del beneficiario validas?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="9.3882" x="186.0249" y="516.7397">si</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="14.46" x="494.0381" y="516.7397">no</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="161.6162" x="104.605" y="544.4434"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="141.6162" x="114.605" y="566.6372">Calcular comision y neto</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.418" x="88.7041" y="599.3921"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173.418" x="98.7041" y="621.5859">Crear o recuperar giro vigente</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="328.8262" x="21" y="654.3408"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.8262" x="31" y="676.5347">PROCESANDO -&gt; EJECUTADO con autor SISTEMA</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.186" x="55.8201" y="709.2896"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="239.186" x="65.8201" y="731.4834">Capturar banco, numero y tipo al ejecutar</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.8188" x="51.5037" y="764.2383"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.8188" x="61.5037" y="786.4321">Registrar resultado y confirmar transaccion</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.8462" x="374.115" y="544.4434"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="239.8462" x="384.115" y="566.6372">Registrar motivo PENDIENTE o FALLIDA</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="176.0698" x="416.0032" y="599.3921"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="156.0698" x="426.0032" y="621.5859">No marcar como ejecutado</text><polygon fill="#F1F1F1" points="344.7256,805.187,356.7256,817.187,344.7256,829.187,332.7256,817.187,344.7256,805.187" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="48.3535" y2="1207.3025"/><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="280.876" x="643.9612" y="849.187"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="260.876" x="653.9612" y="871.3809">Consultar pagos, tasas, netos y liquidaciones</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="262.7788" x="653.0098" y="953.6101"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.7788" x="663.0098" y="975.804">Corregir los datos necesarios con el titular</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="272.1733" x="648.3125" y="1008.5588"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1733" x="658.3125" y="1030.7527">Solicitar revision o esperar el siguiente ciclo</text><rect fill="#F1F1F1" height="34.9487" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="277.2451" x="645.7766" y="1063.5076"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2451" x="655.7766" y="1085.7014">El sistema repite validaciones sin duplicados</text><polygon fill="#F1F1F1" points="699.8579,904.1357,868.9404,904.1357,880.9404,916.1357,868.9404,928.1357,699.8579,928.1357,687.8579,916.1357,699.8579,904.1357" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="9.3882" x="788.3992" y="940.3296">si</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.0825" x="699.8579" y="920.8552">Necesita resolver incidencia?</text><polygon fill="#F1F1F1" points="784.3992,1118.4563,796.3992,1130.4563,784.3992,1142.4563,772.3992,1130.4563,784.3992,1118.4563" style="stroke:#181818;stroke-width:0.5;"/><path d="M815.3992,1152.4563 L815.3992,1175.8794 L795.3992,1179.8794 L815.3992,1183.8794 L815.3992,1207.3025 A0,0 0 0 0 815.3992,1207.3025 L1157.2288,1207.3025 A0,0 0 0 0 1157.2288,1207.3025 L1157.2288,1162.4563 L1147.2288,1152.4563 L815.3992,1152.4563 A0,0 0 0 0 815.3992,1152.4563" fill="#FFF7DB" style="stroke:#A78B40;stroke-width:0.5;"/><path d="M1147.2288,1152.4563 L1147.2288,1162.4563 L1157.2288,1162.4563 L1147.2288,1152.4563" fill="#FFF7DB" style="stroke:#A78B40;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.8296" x="821.3992" y="1169.6501">Operaciones academicas simuladas, sin bancos reales.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="236.3169" x="821.3992" y="1184.5989">La comision se edita para pagos nuevos.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.5405" x="821.3992" y="1199.5476">El historial conserva su tasa, cuenta y autorizacion.</text><ellipse cx="784.3992" cy="1179.8794" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="784.3992" cy="1179.8794" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="637.9612" x2="637.9612" y1="48.3535" y2="1207.3025"/><line style="stroke:#000000;stroke-width:1.5;" x1="1162.2288" x2="1162.2288" y1="48.3535" y2="1207.3025"/><line style="stroke:#334155;stroke-width:1;" x1="344.7256" x2="344.7256" y1="88.3022" y2="108.3022"/><polygon fill="#334155" points="340.7256,98.3022,344.7256,108.3022,348.7256,98.3022,344.7256,102.3022" style="stroke:#334155